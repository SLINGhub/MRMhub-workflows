project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"   # site pages only; exclude CLAUDE.md / README.md from the build

execute:
  freeze: auto

website:
  title: "MRMhub Workflows"
  favicon: images/favicon.ico
  navbar:
    background: "#2d5c80"   # shared MRMhub navy title bar
    foreground: "#ffffff"
    logo: images/mrmhub-logo.png
    logo-alt: "MRMhub"
    left:
      - text: "Home"
        href: index.html
      - text: "Dataset-1 Analysis"
        href: Dataset1.html
      - text: "Dataset-3 Analysis"
        href: Dataset3.html
      - text: "Dataset-4 Analysis"
        href: Dataset4.html
      - text: "Manuscript Figure"
        href: ManuscriptFigure.html
    right:
      - icon: github
        href: https://github.com/SLINGhub/MRMhub-workflows
        aria-label: GitHub

format:
  html:
    # `brand` after `cosmo` so _brand.yml (steel-blue primary) overrides cosmo's
    # default blue; the navy navbar is set above via website.navbar.background.
    theme:
      - cosmo
      - brand
    # `arrow` is the tidyverse-book / RStudio-editor palette (Quarto's default,
    # as used by R for Data Science 2e). It is pastel by design; styles.css
    # deepens the token colours slightly so they don't read as faint.
    highlight-style: arrow
    css: styles.css
